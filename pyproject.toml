[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-darkest-hour"
version = "0.1.0"
description = "Phoenix S1 single-exchange strategy research"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
include = ["darkest_hour*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
